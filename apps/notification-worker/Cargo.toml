[package]
name = "notification-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
futures-util = "0.3.32"
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }
auction-kafka = { path = "../../packages/kafka" }
auction-observability = { path = "../../packages/observability" }
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "libz"] }
dotenvy = "0.15"
redis = { version = "1.3.0", features = ["tokio-comp"] }
auction-redis = { path = "../../packages/redis" }
db = { path = "../../packages/db" }
diesel = { version = "2.2.6", features = ["postgres", "r2d2"] }
uuid = { version = "1.12.1", features = ["v4", "serde"] }
chrono = "0.4"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }
bb8 = "0.9.1"
bb8-redis = "0.26.0"
