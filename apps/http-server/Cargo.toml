[package]
name = "http-server"
version = "0.1.0"
edition = "2021"

[dependencies]
auction-observability = { path = "../../packages/observability" }
axum = { version = "0.7", features = ["multipart"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
garde = { version = "0.18", features = ["derive", "email"] }
db = { path = "../../packages/db" }
diesel = { version = "2.1.0", features = ["postgres", "uuid", "chrono", "r2d2"] }
dotenvy = "0.15"
bcrypt = "0.15"
jsonwebtoken = "9.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
auction-redis = { path = "../../packages/redis" }
redis = { version = "1.3.0", features = ["tokio-comp"] }
sha1 = "0.11.0"
hex = "0.4.3"
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }
rand = "0.8"
bb8 = "0.9.1"
bb8-redis = "0.26.0"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }
