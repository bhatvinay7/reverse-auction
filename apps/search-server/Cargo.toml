[package]
name = "search-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
elasticsearch = "8.19.0-alpha.1"
dotenvy = "0.15"
auction-observability = { path = "../../packages/observability" }
auction-kafka = { path = "../../packages/kafka" }
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "libz"] }
