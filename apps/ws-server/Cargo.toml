[package]
name = "ws-server"
version = "0.1.0"
edition = "2024"

[dependencies]
auction-observability = { path = "../../packages/observability" }
auction-redis = { version = "0.1.0", path = "../../packages/redis" }
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
grpc-client = { version = "0.1.0", path = "../../packages/grpc-client" }
redis = { version = "1.3.0", features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
socketioxide = { version = "0.18.4", features = ["state"] }
socketioxide-redis = "0.4.1"
tokio = { version = "1.52.3", features = ["full"] }
tonic = "0.12.3"
uuid = { version = "1.23.4", features = ["v4"] }
chrono = "0.4"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
bb8 = "0.9.1"
bb8-redis = "0.26.0"
jsonwebtoken = "10.4.0"
