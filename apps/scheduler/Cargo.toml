[package]
name = "scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
diesel = { version = "2.3.10", features = ["postgres", "chrono", "r2d2", "uuid"] }
dotenvy = "0.15.7"
log = "0.4.33"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
uuid = "1.23.4"

db = { path = "../../packages/db" }
rabbitmq = { path = "../../packages/rabbitmq" }
auction-redis = { path = "../../packages/redis" }
futures-util = "0.3.32"
lapin = "4.10.0"
redis = "1.3.0"
bb8 = "0.9.1"
bb8-redis = "0.26.0"
