[package]
name = "auction-engine"
version = "0.1.0"
edition = "2024"

[dependencies]

db = { version = "0.1.0", path = "../../packages/db" }
rabbitmq = { path = "../../packages/rabbitmq" }
auction-redis = { path = "../../packages/redis" }
futures-util = "0.3.32"
tokio = { version = "1.52.3", features = ["full"] }
lapin = "4.10.0"
redis = "1.3.0"
serde_json = "1.0.150"
dotenvy = "0.15.7"
chrono = "0.4.45"
uuid = "1.23.4"
diesel = { version = "2.3.10", features = ["postgres", "chrono", "r2d2", "uuid"] }
dashmap = "6.2.1"
serde = { version = "1.0.228", features = ["derive"] }
socketioxide-emitter = "0.1.0"
bb8 = "0.9.1"
bb8-lapin = "0.8.1"
bb8-redis = "0.26.0"
