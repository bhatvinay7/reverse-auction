name: Bootstrap auction GitOps controllers

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        required: true
      confirm:
        description: Type BOOTSTRAP to modify the cluster
        required: true

concurrency:
  group: auction-bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    if: inputs.confirm == 'BOOTSTRAP'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      KUBESEAL_VERSION: "0.27.3"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bhatvinay7/auction-k8s
          ref: ${{ inputs.environment == 'dev' && 'deployment' || 'main' }}
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Validate pinned infrastructure Helm charts
        shell: bash
        run: |
          helm repo add strimzi https://strimzi.io/charts/
          helm repo update strimzi
          helm template strimzi-kafka-operator strimzi/strimzi-kafka-operator \
            --version 0.43.0 \
            --namespace kafka \
            --set watchAnyNamespace=false >/dev/null
          helm repo add fluent https://fluent.github.io/helm-charts/
          helm repo update fluent
          awk '/^      values: \|/{values=1; next} values {sub(/^        /, ""); print}' \
            infra/base/monitoring/fluent-bit.yaml | \
            helm template fluent-bit fluent/fluent-bit \
              --version 0.57.9 \
              --namespace monitoring \
              -f - >/dev/null
      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        shell: bash
        run: |
          test -n "$KUBE_CONFIG"
          mkdir -p "$RUNNER_TEMP/kube"
          if ! printf '%s' "$KUBE_CONFIG" | base64 --decode > "$RUNNER_TEMP/kube/config" 2>/dev/null; then
            echo "Falling back to raw YAML for KUBE_CONFIG..."
            printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kube/config"
          fi
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
          export KUBECONFIG="$RUNNER_TEMP/kube/config"
          kubectl cluster-info
      - name: Ensure healthy nginx ingress controller
        shell: bash
        run: |
          set -euo pipefail
          controller=$(kubectl get ingressclass nginx --ignore-not-found -o jsonpath='{.spec.controller}')
          if [ -n "$controller" ] && [ "$controller" != "k8s.io/ingress-nginx" ]; then
            echo "The nginx IngressClass must use the ingress-nginx controller."
            exit 1
          fi
          selector='app.kubernetes.io/name=ingress-nginx,app.kubernetes.io/component=controller'
          workloads=$(kubectl get deployments,daemonsets --all-namespaces -l "$selector" \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.kind}{"/"}{.metadata.name}{"\n"}{end}')
          if [ -z "$workloads" ]; then
            echo "Installing missing nginx ingress controller in ingress-nginx."
            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
            helm repo update ingress-nginx
            helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
              --namespace ingress-nginx --create-namespace \
              --version 4.10.0 \
              --set controller.service.type=LoadBalancer \
              --set controller.metrics.enabled=true \
              --set controller.ingressClassResource.enabled=$([ -z "$controller" ] && echo true || echo false) \
              --wait --timeout=10m
            workloads=$(kubectl get deployments,daemonsets -n ingress-nginx -l "$selector" \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.kind}{"/"}{.metadata.name}{"\n"}{end}')
            test -n "$workloads"
          else
            echo "Existing nginx ingress controller found; skipping installation."
          fi
          # An existing controller may have been installed with class creation disabled.
          if [ -z "$(kubectl get ingressclass nginx --ignore-not-found -o name)" ]; then
            printf '%s\n' 'apiVersion: networking.k8s.io/v1' 'kind: IngressClass' \
              'metadata:' '  name: nginx' 'spec:' '  controller: k8s.io/ingress-nginx' | kubectl apply -f -
          fi
          while read -r namespace workload; do
            kubectl rollout status -n "$namespace" "$workload" --timeout=5m
            kubectl wait -n "$namespace" pod -l "$selector" \
              --for=condition=Ready --timeout=5m
          done <<< "$workloads"
      - name: Ensure healthy cert-manager
        shell: bash
        run: |
          set -euo pipefail
          installed=$(kubectl get deployment cert-manager -n cert-manager --ignore-not-found -o name)
          if [ -z "$installed" ]; then
            helm repo add jetstack https://charts.jetstack.io
            helm repo update jetstack
            helm upgrade --install cert-manager jetstack/cert-manager \
              --namespace cert-manager --create-namespace \
              --version v1.13.2 --set installCRDs=true \
              --set webhook.timeoutSeconds=10 --wait --timeout=10m
          else
            echo "Existing cert-manager found; skipping installation."
          fi
          for deployment in cert-manager cert-manager-cainjector cert-manager-webhook; do
            kubectl rollout status deployment/"$deployment" -n cert-manager --timeout=5m
          done
          kubectl wait --for=condition=Established crd/clusterissuers.cert-manager.io --timeout=5m
      - name: Ensure Sealed Secrets controller
        shell: bash
        run: |
          set -euo pipefail
          installed=$(kubectl get deployment sealed-secrets-controller -n kube-system --ignore-not-found -o name)
          if [ -z "$installed" ]; then
            kubectl apply --server-side -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/controller.yaml
          else
            echo "Existing Sealed Secrets controller found; skipping installation."
          fi
      - name: Wait for Sealed Secrets controller
        run: kubectl rollout status -n kube-system deploy/sealed-secrets-controller --timeout=5m
      - name: Install kubeseal
        run: |
          curl -fSL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal
      - name: Wait for controller certificate
        shell: bash
        run: |
          kubectl wait --for=condition=Established crd/sealedsecrets.bitnami.com --timeout=5m
          cert="$RUNNER_TEMP/sealed-secrets-cert.pem"
          for attempt in {1..30}; do
            if kubeseal --controller-name sealed-secrets-controller --controller-namespace kube-system --fetch-cert > "$cert"; then
              openssl x509 -in "$cert" -noout
              echo "SEALED_SECRETS_CERT_FILE=$cert" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "Sealed Secrets controller certificate unavailable"
          exit 1
      - name: Seal Secrets
        env:
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REPLICATION_URL: ${{ secrets.REPLICATION_URL }}
          CDC_SLOT_NAME: ${{ secrets.CDC_SLOT_NAME }}
          CDC_PUBLICATION: ${{ secrets.CDC_PUBLICATION }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          GATEWAY_KEEPER_ADDR: ${{ secrets.GATEWAY_KEEPER_ADDR }}
          SEARCH_SERVER_ADDR: ${{ secrets.SEARCH_SERVER_ADDR }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRPC_SERVER_URL: ${{ secrets.GRPC_SERVER_URL }}
          GATEWAY_KEEPER_GRPC_URL: ${{ secrets.GATEWAY_KEEPER_GRPC_URL }}
          HTTP_SERVER_URL: ${{ secrets.HTTP_SERVER_URL }}
          SEARCH_SERVER_GRPC_URL: ${{ secrets.SEARCH_SERVER_GRPC_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SIGNING_KEY: ${{ secrets.INTERNAL_SIGNING_KEY }}
          INVITATION_ENCRYPTION_KEY: ${{ secrets.INVITATION_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_WS_BASE_URL: ${{ secrets.NEXT_PUBLIC_WS_BASE_URL }}
          NEXT_PUBLIC_SEARCH_API_URL: ${{ secrets.NEXT_PUBLIC_SEARCH_API_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_METRIC_EXPORT_INTERVAL: ${{ secrets.OTEL_METRIC_EXPORT_INTERVAL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          APP_MODE: ${{ secrets.APP_MODE }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          AUCTION_ENVIRONMENT: ${{ secrets.AUCTION_ENVIRONMENT }}
          LOCK_WORKER_CONCURRENCY: ${{ secrets.LOCK_WORKER_CONCURRENCY }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL }}
          KAFKA_REPLICATION_FACTOR: ${{ secrets.KAFKA_REPLICATION_FACTOR }}
          KAFKA_BID_PARTITIONS: ${{ secrets.KAFKA_BID_PARTITIONS }}
          KAFKA_BACKGROUND_PARTITIONS: ${{ secrets.KAFKA_BACKGROUND_PARTITIONS }}
          KAFKA_SSL_CA_BASE64: ${{ secrets.KAFKA_SSL_CA_BASE64 }}
          KAFKA_BROKER_CERT_BASE64: ${{ secrets.KAFKA_BROKER_CERT_BASE64 }}
          KAFKA_BROKER_KEY_BASE64: ${{ secrets.KAFKA_BROKER_KEY_BASE64 }}
          AUCTION_ACTOR_QUEUE_CAPACITY: ${{ secrets.AUCTION_ACTOR_QUEUE_CAPACITY }}
          AUCTION_KAFKA_PARTITION_QUEUE_CAPACITY: ${{ secrets.AUCTION_KAFKA_PARTITION_QUEUE_CAPACITY }}
          DOWNSTREAM_TIMEOUT_SECS: ${{ secrets.DOWNSTREAM_TIMEOUT_SECS }}
          CIRCUIT_FAILURE_THRESHOLD: ${{ secrets.CIRCUIT_FAILURE_THRESHOLD }}
          CIRCUIT_OPEN_SECS: ${{ secrets.CIRCUIT_OPEN_SECS }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TEST_REDIS_URL: ${{ secrets.TEST_REDIS_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ARGOCD_HOST: ${{ secrets.ARGOCD_HOST }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GRAFANA_HOST: ${{ secrets.GRAFANA_HOST }}
          GRPC_URL: ${{ secrets.GRPC_URL }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
          HTTP_SERVER_ADDR: ${{ secrets.HTTP_SERVER_ADDR }}
          PORT: ${{ secrets.PORT }}
          REDIS_EXPORTER_ADDR: ${{ secrets.REDIS_EXPORTER_ADDR }}
          RUST_LOG: ${{ secrets.RUST_LOG }}
          WEB_HOSTNAME: ${{ secrets.WEB_HOSTNAME }}
          WEB_PORT: ${{ secrets.WEB_PORT }}
          WS_SERVER_ADDR: ${{ secrets.WS_SERVER_ADDR }}
          WS_SERVER_URL: ${{ secrets.WS_SERVER_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y python3-yaml
          python3 scripts/seal-secrets.py ${{ inputs.environment }}
      - name: Commit and push GitOps change
        run: |
          git config user.name "auction-delivery[bot]"
          git config user.email "auction-delivery[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "chore(secrets): seal secrets and update hosts for ${{ inputs.environment }}"
          git push origin HEAD:${{ inputs.environment == 'dev' && 'deployment' || 'main' }}
      - name: Preinstall pinned Strimzi CRDs
        shell: bash
        run: |
          # This chart includes CRDs in both crds/ and templates/.
          helm template strimzi-kafka-operator strimzi/strimzi-kafka-operator \
            --version 0.43.0 --namespace kafka --include-crds > "$RUNNER_TEMP/strimzi.yaml"
          python3 - "$RUNNER_TEMP/strimzi.yaml" <<'PYCRDS' > "$RUNNER_TEMP/strimzi-crds.yaml"
          import sys, yaml
          with open(sys.argv[1]) as source:
              crds = [doc for doc in yaml.safe_load_all(source)
                      if doc and doc.get('kind') == 'CustomResourceDefinition']
          names = {doc['metadata']['name'] for doc in crds}
          required = {'kafkas.kafka.strimzi.io', 'kafkanodepools.kafka.strimzi.io',
                      'kafkatopics.kafka.strimzi.io', 'strimzipodsets.core.strimzi.io'}
          if not required <= names:
              sys.exit('Pinned chart is missing required Strimzi CRDs')
          yaml.safe_dump_all(crds, sys.stdout)
          PYCRDS
          kubectl apply --server-side -f "$RUNNER_TEMP/strimzi-crds.yaml"
          kubectl wait --for=condition=Established -f "$RUNNER_TEMP/strimzi-crds.yaml" --timeout=5m
      - name: Install Argo CD and deploy the Strimzi Helm Application
        shell: bash
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          # Server-side apply avoids storing large CRDs in the last-applied annotation.
          # Bootstrap owns the upstream Argo CD installation fields, including those
          # previously written by kubectl-client-side-apply during earlier installs.
          kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=Established crd/applications.argoproj.io \
            crd/applicationsets.argoproj.io crd/appprojects.argoproj.io --timeout=5m
          for deployment in argocd-server argocd-repo-server argocd-applicationset-controller \
            argocd-notifications-controller argocd-dex-server argocd-redis; do
            kubectl rollout status deployment/"$deployment" -n argocd --timeout=10m
          done
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=10m
          kubectl apply -f argocd/argocd-health-config.yaml
      - name: Configure Argo CD GitOps repository access
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        shell: bash
        run: |
          # Pass the credential through stdin; never write plaintext to the checkout.
          python3 - <<'PYREPO' | kubeseal --controller-name sealed-secrets-controller --controller-namespace kube-system --cert "$SEALED_SECRETS_CERT_FILE" --format json | kubectl apply --server-side -f -
          import base64, json, os, sys
          token = os.environ.get('GITOPS_TOKEN', '')
          if not token:
              sys.exit('GITOPS_TOKEN is required for Argo CD repository access')
          values = {'type': 'git', 'url': 'https://github.com/bhatvinay7/auction-k8s.git',
                    'username': 'x-access-token', 'password': token}
          print(json.dumps({'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'auction-gitops-repository', 'namespace': 'argocd',
                           'labels': {'argocd.argoproj.io/secret-type': 'repository'}},
              'type': 'Opaque',
              'data': {key: base64.b64encode(value.encode()).decode() for key, value in values.items()}}))
          PYREPO
          kubectl wait -n argocd sealedsecret/auction-gitops-repository --for=condition=Synced --timeout=5m
      - name: Create kafka-broker-tls secret from base64 secrets
        env:
          KAFKA_SSL_CA_BASE64: ${{ secrets.KAFKA_SSL_CA_BASE64 }}
          KAFKA_BROKER_CERT_BASE64: ${{ secrets.KAFKA_BROKER_CERT_BASE64 }}
          KAFKA_BROKER_KEY_BASE64: ${{ secrets.KAFKA_BROKER_KEY_BASE64 }}
        shell: bash
        run: |
          python3 - <<'PYKAFKA'
          import base64, os, subprocess, sys
          from pathlib import Path

          def decode(env_var):
              raw = os.environ.get(env_var, '')
              if not raw:
                  sys.exit(f'{env_var} is required')
              cleaned = ''.join(raw.split())          # strip all whitespace/newlines
              cleaned += '=' * (-len(cleaned) % 4)   # fix any missing padding
              return base64.b64decode(cleaned)

          tmp      = Path(os.environ['RUNNER_TEMP'])
          ca_file  = tmp / 'kafka-ca.crt'
          crt_file = tmp / 'kafka-tls.crt'
          key_file = tmp / 'kafka-tls.key'

          ca_file.write_bytes(decode('KAFKA_SSL_CA_BASE64'))
          crt_file.write_bytes(decode('KAFKA_BROKER_CERT_BASE64'))
          key_file.write_bytes(decode('KAFKA_BROKER_KEY_BASE64'))

          # Validate PEMs are well-formed before touching the cluster.
          for cmd in [
              ['openssl', 'x509', '-in', str(ca_file),  '-noout'],
              ['openssl', 'x509', '-in', str(crt_file), '-noout'],
              ['openssl', 'rsa',  '-in', str(key_file), '-check', '-noout'],
          ]:
              r = subprocess.run(cmd, capture_output=True)
              if r.returncode != 0:
                  sys.exit(f'PEM validation failed ({cmd[3]}): {r.stderr.decode().strip()}')

          # Ensure the kafka namespace exists.
          ns = subprocess.check_output(
              ['kubectl', 'create', 'namespace', 'kafka', '--dry-run=client', '-o', 'yaml'])
          subprocess.run(['kubectl', 'apply', '-f', '-'], input=ns, check=True)

          # Create (or idempotently replace) kafka-broker-tls.
          dry = subprocess.check_output([
              'kubectl', 'create', 'secret', 'generic', 'kafka-broker-tls',
              '--namespace', 'kafka',
              f'--from-file=tls.crt={crt_file}',
              f'--from-file=tls.key={key_file}',
              f'--from-file=ca.crt={ca_file}',
              '--type=kubernetes.io/tls',
              '--save-config', '--dry-run=client', '-o', 'yaml',
          ])
          subprocess.run(['kubectl', 'apply', '-f', '-'], input=dry, check=True)

          for f in (ca_file, crt_file, key_file):
              f.unlink(missing_ok=True)
          print('kafka-broker-tls applied to namespace kafka.')
          PYKAFKA

      - name: Deploy GitOps root and Strimzi Application
        shell: bash
        run: |
          # Start the operator independently of root-chart repository reconciliation.
          helm template auction-root argocd/chart \
            --show-only templates/strimzi-application.yaml | kubectl apply -f -
          python3 scripts/render-argocd-root.py ${{ inputs.environment == 'dev' && 'deployment' || 'main' }} | kubectl apply -f -

      - name: Wait for Strimzi and the KRaft cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          diagnostics() {
            kubectl get applications -n argocd || true
            kubectl get applications -n argocd auction-root auction-strimzi auction-infra \
              -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.status.conditions}{" "}{.status.operationState.message}{"\n"}{end}' || true
            kubectl get deployments,pods -n kafka || true
          }
          trap diagnostics ERR
          # Surface the operator's sync failure while waiting, not only at timeout.
          strimzi_status() {
            kubectl get application auction-strimzi -n argocd -o json --request-timeout=30s | python3 -c '
          import json, sys
          status = json.load(sys.stdin).get("status", {})
          print("Strimzi Application: sync=" + status.get("sync", {}).get("status", "Pending") +
                ", health=" + status.get("health", {}).get("status", "Pending"))
          for condition in status.get("conditions", []):
              print(condition.get("type", "Condition") + ": " + condition.get("message", ""))
          operation = status.get("operationState", {})
          if operation.get("phase") in ("Failed", "Error"):
              print("Sync " + operation["phase"] + ": " + operation.get("message", ""))
          '
          }
          # Argo CD reconciles asynchronously. A condition wait alone fails with
          # NotFound until the CRD, operator and Kafka resource have been created.
          wait_for_resource() {
            local resource="$1"
            shift
            local deadline=$((SECONDS + 900))
            local found
            local attempt=0
            while (( SECONDS < deadline )); do
              found=$(kubectl get "$resource" "$@" --ignore-not-found -o name --request-timeout=30s)
              if [ -n "$found" ]; then
                return 0
              fi
              echo "Waiting for Argo CD to create $resource..."
              if (( attempt % 6 == 0 )); then
                strimzi_status
              fi
              attempt=$((attempt + 1))
              sleep 10
            done
            echo "Timed out waiting for $resource; inspect Argo CD sync diagnostics below."
            return 1
          }
          wait_for_resource crd/kafkas.kafka.strimzi.io
          kubectl wait --for=condition=Established \
            crd/kafkas.kafka.strimzi.io --timeout=15m
          wait_for_resource deployment/strimzi-cluster-operator -n kafka
          kubectl rollout status deployment/strimzi-cluster-operator \
            -n kafka --timeout=15m
          wait_for_resource kafka/auction-kafka -n kafka
          kubectl wait kafka/auction-kafka -n kafka \
            --for=condition=Ready --timeout=20m
      - name: Checkout application bootstrap scripts
        uses: actions/checkout@v4
        with:
          path: auction-source
          persist-credentials: false
      - name: Ensure Kafka topics exist
        run: python3 auction-source/scripts/ensure-kafka-topics.py "$GITHUB_WORKSPACE"
