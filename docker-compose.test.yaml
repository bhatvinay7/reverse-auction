  grpc:
    <<: *app-defaults
    env_file:
      - .env
      - apps/grpc/.env
    build:
      context: .
      dockerfile: apps/grpc/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the cloud Postgres URL}
        REDIS_URL: ${REDIS_URL:?set REDIS_URL to the cloud Redis URL}
    environment:
      <<: *service-environment
      PORT: "50051"
      HTTP_PORT: "8083"
    ports:
      - "50051:50051"
      - "8083:8083"
    cpus: 0.35
    mem_limit: 192m
    mem_reservation: 96m

  auction-engine:
    <<: *app-defaults
    env_file:
      - .env
      - apps/auction-engine/.env
    build:
      context: .
      dockerfile: apps/auction-engine/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the cloud Postgres URL}
        REDIS_URL: ${REDIS_URL:?set REDIS_URL to the cloud Redis URL}
    environment:
      <<: *service-environment
      AUCTION_ACTOR_QUEUE_CAPACITY: "1000"
      AUCTION_KAFKA_PARTITION_QUEUE_CAPACITY: "1000"
    cpus: 0.75
    mem_limit: 384m
    mem_reservation: 160m

  http-server:
    <<: *app-defaults
    env_file:
      - .env
      - apps/http-server/.env
    build:
      context: .
      dockerfile: apps/http-server/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the cloud Postgres URL}
        REDIS_URL: ${REDIS_URL:?set REDIS_URL to the cloud Redis URL}
    environment:
      <<: *service-environment
      HTTP_SERVER_ADDR: "0.0.0.0:8082"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8082:8082"
    cpus: 0.50
    mem_limit: 320m
    mem_reservation: 128m

  ws-server:
    <<: *app-defaults
    env_file:
      - .env
      - apps/ws-server/.env
    build:
      context: .
      dockerfile: apps/ws-server/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the cloud Postgres URL}
        REDIS_URL: ${REDIS_URL:?set REDIS_URL to the cloud Redis URL}
    environment:
      <<: *service-environment
      GRPC_URL: http://grpc:50051
      WS_SERVER_ADDR: "0.0.0.0:8081"
    ports:
      - "8081:8081"
    # depends_on:
    #   grpc:
    #     condition: service_started
    #   redis:
    #     condition: service_healthy
    cpus: 0.35
    mem_limit: 224m
    mem_reservation: 96m

  gateway-keeper:
    <<: *app-defaults
    env_file:
      - .env
      - apps/gateway-keeper/.env
    build:
      context: .
      dockerfile: apps/gateway-keeper/Dockerfile
    environment:
      <<: *service-environment
      INTERNAL_SIGNING_KEY: test-only-internal-signing-key-with-32-bytes
      HTTP_SERVER_URL: http://http-server:8082
      WS_SERVER_URL: http://ws-server:8081
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      DOWNSTREAM_TIMEOUT_SECS: "15"
      CIRCUIT_FAILURE_THRESHOLD: "5"
      CIRCUIT_OPEN_SECS: "20"
    ports:
      - "8080:8080"
    depends_on:
      http-server:
        condition: service_started
      ws-server:
        condition: service_started
    cpus: 0.35
    mem_limit: 192m
    mem_reservation: 80m

  scheduler:
    <<: *app-defaults
    env_file:
      - .env
      - apps/scheduler/.env
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the cloud Postgres URL}
        REDIS_URL: ${REDIS_URL:?set REDIS_URL to the cloud Redis URL}
    environment:
      <<: *service-environment
    cpus: 0.25
    mem_limit: 160m
    mem_reservation: 64m

  notification-worker:
    <<: *app-defaults
    env_file:
      - .env
      - apps/notification-worker/.env
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the cloud Postgres URL}
        REDIS_URL: ${REDIS_URL:?set REDIS_URL to the cloud Redis URL}
    environment:
      <<: *service-environment
    cpus: 0.25
    mem_limit: 192m
    mem_reservation: 80m

