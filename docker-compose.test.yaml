name: auction-test

x-service-environment: &service-environment
  KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka-20d2257f-bookit.d.aivencloud.com:26733}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
  KAFKA_USERNAME: ${KAFKA_USERNAME:-avnadmin}
  KAFKA_PASSWORD: ${KAFKA_PASSWORD:?set KAFKA_PASSWORD for Aiven Kafka}
  KAFKA_SSL_CA_BASE64: ${KAFKA_SSL_CA_BASE64:?set KAFKA_SSL_CA_BASE64 to the base64-encoded Kafka CA}
  KAFKA_REPLICATION_FACTOR: "2"
  KAFKA_BID_PARTITIONS: "2"
  KAFKA_BACKGROUND_PARTITIONS: "2"
  KAFKA_BID_RETENTION_MS: "259200000"
  KAFKA_DECISION_RETENTION_MS: "259200000"
  KAFKA_NOTIFICATION_RETENTION_MS: "259200000"
  KAFKA_SYNC_RETENTION_MS: "259200000"
  KAFKA_DLQ_RETENTION_MS: "259200000"
  JWT_SECRET: test-only-jwt-secret-with-at-least-32-bytes
  RUST_LOG: info

x-app-defaults: &app-defaults
  restart: on-failure:3
  networks:
    - auction-test
  security_opt:
    - no-new-privileges:true
  pids_limit: 128

